name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # nightly regression run against the live demo shop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        # One retry absorbs network hiccups of the public site; real failures still fail the build.
        run: >
          pytest --browser ${{ matrix.browser }} -n auto --reruns 1
          --alluredir=allure-results --output=test-results

      - name: Add browser info to Allure results
        if: always()
        run: echo "Browser=${{ matrix.browser }}" > allure-results/environment.properties

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 7

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}
          path: test-results
          retention-days: 7

  report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download results of all browsers
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Describe the run
        run: |
          printf 'Browsers=chromium, firefox, webkit\nSite=https://www.saucedemo.com\nCommit=%s\n' "${GITHUB_SHA::7}" \
            > allure-results/environment.properties
          cp .github/allure/categories.json allure-results/

      - name: Generate Allure report
        run: npx --yes allure-commandline@2.32.0 generate allure-results --clean -o allure-report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
